{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-3 my-md-4">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border shadow-xs rounded-3 p-4 p-md-4 bg-white">
            <h1 class="h4 fw-bold text-dark text-center mb-4">{{ _('Register') }}</h1>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">{{ _('Username') }}</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-secondary">{{ _('Email') }}</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary">{{ _('Password') }}</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 shadow-xs mb-3">{{ _('Register') }}</button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="small text-muted mb-0">
                    {{ _('Already have an account?') }}
                    <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">{{ _('Login here') }}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
