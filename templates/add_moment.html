{% extends "base.html" %}

{% block content %}
<div class="mx-auto" style="max-width: 820px;">
    <div class="card border shadow-xs rounded-3 p-4 p-md-5 mb-4 bg-white">
        <header class="mb-4 pb-2 border-bottom">
            <h1 class="h4 fw-bold text-dark mb-0">{{ _('Add a Secret Moment') }}</h1>
        </header>

        <form method="POST">
            <div class="mb-4">
                <label for="moment" class="form-label fw-semibold text-secondary small">{{ _('Your Secret Moment') }}</label>
                <textarea class="form-control" id="moment" name="moment" rows="6" placeholder="{{ _('Share your secret thought or moment...') }}" required autofocus></textarea>
            </div>
            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                <button type="submit" class="btn btn-primary btn-sm px-4 shadow-xs">
                    {{ _('Share Moment') }}
                </button>
                <a href="{{ url_for('moments.moments') }}" class="btn btn-outline-secondary btn-sm">{{ _('Cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
