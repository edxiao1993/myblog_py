{% extends "base.html" %}

{% block content %}
<div class="mx-auto" style="max-width: 820px;">
    <div class="card border shadow-xs rounded-3 p-4 p-md-5 mb-4 bg-white">
        <header class="mb-4 pb-2 border-bottom">
            <h1 class="h4 fw-bold text-dark mb-0">{{ _('Create New Post') }}</h1>
        </header>

        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label fw-semibold text-secondary small">{{ _('Title') }}</label>
                <input type="text" class="form-control" id="title" name="title" required autofocus>
            </div>
            <div class="mb-4">
                <label for="content" class="form-label fw-semibold text-secondary small">{{ _('Content') }}</label>
                <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                <button type="submit" class="btn btn-primary btn-sm px-4 shadow-xs">
                    {{ _('Create Post') }}
                </button>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary btn-sm">{{ _('Cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
